<h2 mat-dialog-title>Confirmation de suppression</h2>
<mat-dialog-content>
  <p>Êtes-vous sûr de vouloir supprimer ce post ?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-button color="warn" (click)="onDelete()">OK</button>
</mat-dialog-actions>
